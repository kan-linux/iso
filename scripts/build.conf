KANLINUX_NAME="kan-linux"
KANLINUX_VERSION="0.2.6"
KANLINUX_CODENAME="qianyuan"

LINUX_VERSION="7.3.0-rc5"

QEMU_RAM="16G"
QEMU_CPUS="8"
QEMU_DISPLAY="gtk"
QEMU_ENABLE_KVM=1
QEMU_ENABLE_SSH=1
QEMU_SSH_PORT="2222"

TARGET_ARCH="x86_64"
HOST_ARCH=$(uname -m)

ISO_NAME="kan-linux-${KANLINUX_VERSION}-${TARGET_ARCH}.iso"
ISO_VOLUME_LABEL="kan-linux ${KANLINUX_VERSION}"

RED='\033[0;31m'
GREEN='\033[0;32m'
YELLOW='\033[1;33m'
BLUE='\033[0;34m'
NC='\033[0m'

log()    { echo -e "${GREEN}[$(date '+%Y-%m-%d %H:%M:%S')]${NC} $1"; }
warn()   { echo -e "${YELLOW}[WARNING]${NC} $1"; }
error()  { echo -e "${RED}[ERROR]${NC} $1"; exit 1; }
info()   { echo -e "${BLUE}[INFO]${NC} $1"; }
